name: Post-deploy smoke test

# Vercel's GitHub integration deploys every push (main → production, other
# branches/PRs → preview) and reports a GitHub deployment status. This workflow
# runs against each successful deployment and checks that it actually works.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      # Optional: Vercel "Protection Bypass for Automation" secret, needed while
      # Vercel Authentication protects the deployment.
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test ${{ github.event.deployment.environment }}
        run: bash scripts/smoke.sh "$BASE_URL"
